<!DOCTYPE html>
<html>
<head>
    <title>Claude Usage Analytics</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #d4d4d4;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #252525;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            color: #2c84db;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #454545;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"></path>
                <path d="m19 9-5 5-4-4-3 3"></path>
            </svg>
            Usage Analytics
        </h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div id="stat-total" class="stat-value">0</div>
                <div class="stat-label">Total Tokens (30d)</div>
            </div>
            <div class="stat-card">
                <div id="stat-avg" class="stat-value">0</div>
                <div class="stat-label">Avg Daily Usage</div>
            </div>
            <div class="stat-card">
                <div id="stat-peak" class="stat-value">0</div>
                <div class="stat-label">Peak Day</div>
            </div>
        </div>

        <canvas id="usageChart"></canvas>
    </div>

    <script src="lib/browser-polyfill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
